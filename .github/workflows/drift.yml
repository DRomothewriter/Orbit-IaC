name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    name: Detect Infrastructure Drift (Read-Only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          role-session-name: GitHubActions-OrbitIaC-Drift-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Run Terraform Plan with detailed exitcode
        id: drift-plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color > terraform-drift-report.txt 2>&1
          PLAN_EXIT=$?
          set -e

          echo "exit_code=${PLAN_EXIT}" >> "$GITHUB_OUTPUT"

          if [ "$PLAN_EXIT" -eq 2 ]; then
            echo "::warning::Se detectó drift en la infraestructura respecto al estado de Terraform."
          elif [ "$PLAN_EXIT" -ne 0 ]; then
            echo "::error::terraform plan falló con código ${PLAN_EXIT}."
            cat terraform-drift-report.txt
            exit "$PLAN_EXIT"
          else
            echo "No se detectó drift en la infraestructura."
          fi

      - name: Upload Terraform Drift Report artifact
        if: always() && hashFiles('terraform-drift-report.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-report
          path: terraform-drift-report.txt
          retention-days: 30

      - name: Fail workflow when drift is detected
        if: steps.drift-plan.outputs.exit_code == '2'
        run: |
          echo "::error::Drift detectado (exit code 2). Revisar el artefacto terraform-drift-report."
          exit 1
