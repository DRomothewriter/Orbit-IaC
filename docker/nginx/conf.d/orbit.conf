# ==============================================================================
# ORBIT BACKEND - NGINX VIRTUAL HOST CONFIGURATION
# ==============================================================================

# 1. Redirección de HTTP (80) a HTTPS (443) y verificación ACME Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name api.orbit.diego-romo-dev.com;

    # Desafío ACME para emisión y renovación automática con Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección forzada a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS seguro (443) con terminación SSL y soporte para WebSockets
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.orbit.diego-romo-dev.com;

    # Certificados SSL gestionados por Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/api.orbit.diego-romo-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orbit.diego-romo-dev.com/privkey.pem;

    # Parámetros de seguridad SSL/TLS recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Encabezados de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Tamaño máximo de cuerpo para subidas multimedia con multer-s3
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # WEBSOCKETS ENDPOINT (/socket.io/)
    # Requiere Upgrade y Connection para evitar degradación a polling continuo
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Encabezados obligatorios para negociación y persistencia de WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de 24 horas para mantener los sockets de audio/video y chat activos
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # REST API Y DOCUMENTACIÓN SWAGGER
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
